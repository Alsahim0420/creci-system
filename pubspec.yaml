name: creci_system
description: "GoF Design Patterns Interactive Showcase - Flutter Web Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.0.0

  # Routing & Navigation
  go_router: ^10.1.0

  # UI & Design
  google_fonts: ^6.1.0
  flutter_animate: ^4.1.1

  # Icons
  cupertino_icons: ^1.0.2

  # Utilities
  intl: ^0.19.0
  uuid: ^3.0.7

  # Code highlighting
  highlight: ^0.7.0

  # Syntax highlighting for Dart
  flutter_highlight: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
